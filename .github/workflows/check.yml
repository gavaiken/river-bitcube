# tools/check on every push and pull request: the show registry, the Python tests and mission control's tests.
# Nothing here needs bitcube, TouchDesigner or secrets; tests that do skip themselves.
name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the metadata freshness check diffs against the push's (or the PR's) base
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Python test requirements
        run: python -m pip install -q -r tools/pixelmap/requirements.txt
      - name: tools/check
        env:
          PYTHON: python
          # a push: what it added since the branch's previous tip; a PR: since its base. A new branch has no before (all zeros): skipped
          CHECK_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: tools/check
