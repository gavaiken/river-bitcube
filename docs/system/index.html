<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>River system map</title>
<meta name="description" content="A River Becoming: every machine, device, service and connection, with IPs, ports, usernames and the Modal to bitcube API. No secrets.">
<link rel="icon" href="data:,">
<style>
:root {
  color-scheme: light;
  --bg: #f2f5f6; --surface: #ffffff; --surface-2: #e9eef0; --place: #e6edef; --place-line: #c9d5da;
  --ink: #13232c; --muted: #566a73; --line: #b9c7cd; --line-strong: #7d8f97;
  --accent: #0b7a84; --accent-ink: #ffffff; --focus: #0b7a84;
  --m-artnet: #cf5f0c; --m-ethernet: #8a5a2b; --m-xlr: #ad7f0a; --m-video: #7848c2; --m-lan: #2b8040;
  --m-tailscale: #2460c4; --m-https: #b4306a; --m-git: #47525c; --m-starlink: #677c12; --m-internal: #8796a0;
  --s-working: #2b8a3e; --s-partial: #b8860b; --s-standby: #5b7c99; --s-planned: #8a979e; --s-blocked: #c77700;
  --s-broken: #c62828; --s-stopped: #6b7780; --s-unknown: #9aa6ac;
  --shadow: 0 6px 24px rgba(19, 35, 44, .14);
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0c1418; --surface: #13202a; --surface-2: #1a2a34; --place: #111d24; --place-line: #2a3d47;
    --ink: #e2ebee; --muted: #93a6ae; --line: #33474f; --line-strong: #6a8089;
    --accent: #45c1cb; --accent-ink: #062b2f; --focus: #6fd6de;
    --m-artnet: #f08a3c; --m-ethernet: #c79a6b; --m-xlr: #dfb54a; --m-video: #a98aee; --m-lan: #6cc47e;
    --m-tailscale: #7aa8f7; --m-https: #ee7daa; --m-git: #a9b3bc; --m-starlink: #b5c952; --m-internal: #74858d;
    --s-working: #5cc46f; --s-partial: #e0b54a; --s-standby: #8fb0cc; --s-planned: #7d8d94; --s-blocked: #f0a33c;
    --s-broken: #ff6b61; --s-stopped: #8a979e; --s-unknown: #6b7a80;
    --shadow: 0 6px 28px rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0c1418; --surface: #13202a; --surface-2: #1a2a34; --place: #111d24; --place-line: #2a3d47;
  --ink: #e2ebee; --muted: #93a6ae; --line: #33474f; --line-strong: #6a8089;
  --accent: #45c1cb; --accent-ink: #062b2f; --focus: #6fd6de;
  --m-artnet: #f08a3c; --m-ethernet: #c79a6b; --m-xlr: #dfb54a; --m-video: #a98aee; --m-lan: #6cc47e;
  --m-tailscale: #7aa8f7; --m-https: #ee7daa; --m-git: #a9b3bc; --m-starlink: #b5c952; --m-internal: #74858d;
  --s-working: #5cc46f; --s-partial: #e0b54a; --s-standby: #8fb0cc; --s-planned: #7d8d94; --s-blocked: #f0a33c;
  --s-broken: #ff6b61; --s-stopped: #8a979e; --s-unknown: #6b7a80;
  --shadow: 0 6px 28px rgba(0, 0, 0, .5);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); padding-inline: 16px; padding-bottom: env(safe-area-inset-bottom, 0px); }
a { color: var(--accent); }
code, .mono { font-family: var(--mono); font-size: .9em; }
h1, h2, h3 { text-wrap: balance; line-height: 1.2; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); margin-inline: -16px; padding: 10px 16px 0; border-bottom: 1px solid var(--line); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.brand { display: flex; flex-direction: column; margin-right: auto; min-width: 0; }
.brand a { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-decoration: none; }
.brand a:hover { color: var(--accent); }
.brand h1 { margin: 0; font-size: 20px; font-weight: 650; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; font-size: 14px; white-space: nowrap; }
.seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.search { position: relative; flex: 1 1 220px; max-width: 360px; }
.search input { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; }
.results { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); max-height: 60vh; overflow: auto; z-index: 30; }
.results button { display: flex; width: 100%; gap: 8px; justify-content: space-between; border: 0; background: none; padding: 7px 10px; text-align: left; cursor: pointer; font-size: 14px; }
.results button:hover, .results button.active { background: var(--surface-2); }
.results small { color: var(--muted); font-family: var(--mono); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.results p { margin: 0; padding: 8px 10px; color: var(--muted); font-size: 14px; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 14px; white-space: nowrap; }
.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
.tabs button { border: 0; background: none; padding: 8px 12px; border-bottom: 2px solid transparent; cursor: pointer; color: var(--muted); white-space: nowrap; font-size: 14px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
@media (pointer: coarse), (max-width: 600px) {   /* a finger: 44 px targets, 8 px apart (mission control's map embeds this page) */
  .icon-btn, .tabs button, .seg button { min-height: 44px; min-width: 44px; }
  .tabs { gap: 8px; }
}

main { padding-block: 14px 40px; }
body.panel-open main { margin-right: 420px; }
.lede { margin: 0 0 10px; color: var(--muted); max-width: 80ch; }
.lede strong { color: var(--ink); }

/* map */
.map-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.map-tools .hint { color: var(--muted); font-size: 13px; }
.map-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); -webkit-overflow-scrolling: touch; }
#map { display: block; width: 100%; height: auto; font-family: var(--sans); user-select: none; -webkit-user-select: none; }
.place rect { fill: var(--place); stroke: var(--place-line); stroke-width: 1; }
.place .pname { fill: var(--ink); font-size: 13px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
.place .psub { fill: var(--muted); font-size: 11.5px; font-family: var(--mono); }
.link { cursor: pointer; }
.link .line { fill: none; stroke-width: 1.8; }
.link .hit { fill: none; stroke: transparent; stroke-width: 14; }
.link .head { stroke: none; }
.link.dash .line { stroke-dasharray: 7 5; }
.link.dot .line { stroke-dasharray: 2 4; stroke-linecap: round; }
.link.m-internal .line { stroke-width: 1.2; }
.link .lbl { font-size: 11.5px; fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.link .lbl.hover-only { display: none; }
.link:hover .lbl.hover-only, .link.sel .lbl.hover-only, .link:focus-visible .lbl.hover-only { display: inline; }
.link.hl .line, .link.sel .line { stroke-width: 3; }
.link:focus { outline: none; }
.link:focus-visible .line { stroke-width: 3.5; }
.node { cursor: pointer; }
.node:focus { outline: none; }
.node .box { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.2; }
.node.unverified .box { stroke-dasharray: 4 3; }
.node .name { fill: var(--ink); font-size: 13px; font-weight: 600; pointer-events: none; }
.node .sub { fill: var(--muted); font-size: 11px; font-family: var(--mono); pointer-events: none; }
.node .dot { stroke: var(--surface); stroke-width: 1.5; }
.node:hover .box, .node.hl .box { stroke: var(--accent); stroke-width: 2; }
.node.sel .box { stroke: var(--accent); stroke-width: 2.6; fill: var(--surface-2); }
.node:focus-visible .box { stroke: var(--focus); stroke-width: 3; }
.node.rope .name { font-size: 11.5px; }
.node.rope.broken .box { fill: var(--surface-2); }
.node.rope.broken .name { fill: var(--muted); text-decoration: line-through; }
#map .node, #map .link { transition: opacity .15s; }
#map.focusing .node:not(.hl):not(.hl2):not(.sel), #map.focusing .link:not(.hl):not(.sel) { opacity: .22; }
#map.searching .node:not(.match), #map.searching .link:not(.match) { opacity: .14; }
#map.searching .node.match .box { stroke: var(--accent); stroke-width: 2.4; }
@media (prefers-reduced-motion: reduce) { #map .node, #map .link { transition: none; } }

.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 13px; color: var(--muted); }
.legend .group { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.legend .group > b { color: var(--ink); font-weight: 600; margin-right: 2px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend svg { flex: none; }

/* panel */
.panel { position: fixed; z-index: 25; right: 0; top: var(--top-h, 120px); bottom: 0; width: 420px; background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; }
.panel-head { display: flex; gap: 10px; align-items: flex-start; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.panel-head .kicker { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.panel-head h2 { margin: 2px 0 0; font-size: 19px; overflow-wrap: anywhere; }
.panel-head .actions { margin-left: auto; display: flex; gap: 6px; flex: none; }
.panel-body { overflow: auto; padding: 12px 16px 28px; overscroll-behavior: contain; }
.panel-body > p.summary { margin: 0 0 12px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 10px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.pill i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.pill.warn { border-color: var(--s-blocked); }
.sec { margin-top: 16px; }
.sec h3 { font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
dl.kv { display: grid; grid-template-columns: minmax(90px, max-content) 1fr; gap: 4px 12px; margin: 0; }
dl.kv dt { color: var(--muted); font-size: 13.5px; }
dl.kv dd { margin: 0; overflow-wrap: anywhere; }
dl.kv dl.kv { margin-top: 2px; }
ul.plain { margin: 0; padding-left: 18px; }
ul.plain li { margin: 2px 0; overflow-wrap: anywhere; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
td { overflow-wrap: anywhere; }
.conn { display: flex; flex-direction: column; gap: 4px; }
.conn button, .xref { display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 6px 9px; cursor: pointer; }
.conn button:hover, .xref:hover { border-color: var(--accent); }
.conn .sw { width: 14px; height: 3px; flex: none; border-radius: 2px; align-self: center; }
.conn .what { flex: 1; min-width: 0; }
.conn small { color: var(--muted); font-family: var(--mono); font-size: 12px; }
.xref { display: inline-flex; width: auto; padding: 2px 8px; font-size: 14px; }
.endpoints { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 4px 0 10px; }
details.raw { margin-top: 18px; }
details.raw summary { cursor: pointer; color: var(--muted); font-size: 13.5px; }
pre { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow: auto; font: 12.5px/1.45 var(--mono); max-height: 420px; margin: 6px 0; }
.copy { font-size: 12.5px; padding: 3px 9px; }
.prewrap { position: relative; }
.prewrap .copy { position: absolute; top: 6px; right: 6px; }

/* other tabs */
.doc { max-width: 1100px; }
.doc h2 { font-size: 20px; margin: 24px 0 8px; }
.doc h2:first-child { margin-top: 4px; }
.doc h3 { font-size: 16px; margin: 18px 0 6px; }
.doc p { max-width: 80ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 10px 0; }
.method { font: 700 12px var(--mono); padding: 2px 7px; border-radius: 5px; background: var(--accent); color: var(--accent-ink); margin-right: 8px; }
.ep-path { font-family: var(--mono); font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
tr.row { cursor: pointer; }
tr.row:hover td, tr.row:focus-visible td { background: var(--surface-2); }
tr.row:focus { outline: none; }
tr.row:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.callout { border: 1px solid var(--s-blocked); background: var(--surface); border-radius: 10px; padding: 10px 14px; max-width: 80ch; }
.qgroup { margin-bottom: 18px; }
.qgroup li { margin: 6px 0; }
.qgroup .rel { display: inline-flex; flex-wrap: wrap; gap: 4px; margin-left: 6px; vertical-align: middle; }
.qgroup .rel .xref { font-size: 12.5px; padding: 1px 7px; }
footer { color: var(--muted); font-size: 13px; padding-block: 0 24px; max-width: 80ch; }
body.panel-open footer { margin-right: 420px; }
.err { padding: 20px; border: 1px solid var(--s-broken); border-radius: 10px; background: var(--surface); }

@media (max-width: 900px) {
  body.panel-open main, body.panel-open footer { margin-right: 0; }
  .panel { top: auto; left: 0; width: auto; max-height: 72vh; border-left: 0; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .brand h1 { font-size: 18px; }
  .search { max-width: none; order: 3; flex-basis: 100%; }
}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="bar">
    <div class="brand"><a href="../">A River Becoming · status</a><h1>System map</h1></div>
    <div class="seg" role="radiogroup" aria-label="Scenario" id="scenarios" hidden></div>
    <div class="search">
      <label for="q" class="vh">Search by name, IP or hostname</label>
      <input id="q" type="search" placeholder="Search name, IP, hostname ( / )" autocomplete="off" spellcheck="false" aria-controls="results">
      <div class="results" id="results" hidden></div>
    </div>
    <button type="button" class="icon-btn" id="theme" title="Switch theme">Theme: auto</button>
  </div>
  <nav class="tabs" role="tablist" aria-label="Views">
    <button type="button" role="tab" id="t-map" data-tab="map" aria-selected="true" aria-controls="tab-map">Map</button>
    <button type="button" role="tab" id="t-list" data-tab="list" aria-selected="false" aria-controls="tab-list">List</button>
    <button type="button" role="tab" id="t-api" data-tab="api" aria-selected="false" aria-controls="tab-api">Modal ↔ bitcube API</button>
    <button type="button" role="tab" id="t-secrets" data-tab="secrets" aria-selected="false" aria-controls="tab-secrets">Secrets</button>
    <button type="button" role="tab" id="t-questions" data-tab="questions" aria-selected="false" aria-controls="tab-questions">Open questions</button>
    <button type="button" role="tab" id="t-agents" data-tab="agents" aria-selected="false" aria-controls="tab-agents">For agents</button>
  </nav>
</header>

<main id="main">
  <section id="tab-map" role="tabpanel" aria-labelledby="t-map">
    <p class="lede" id="scenario-lede">Loading the system map…</p>
    <div class="map-tools">
      <button type="button" class="icon-btn" id="zoom-out" aria-label="Zoom out">−</button>
      <button type="button" class="icon-btn" id="zoom-fit">Fit</button>
      <button type="button" class="icon-btn" id="zoom-in" aria-label="Zoom in">+</button>
      <span class="hint">Click or tab to any box or line for its details. Hover to see what it connects to.</span>
    </div>
    <figure style="margin:0">
      <div class="map-wrap" id="mapwrap">
        <svg id="map" role="group" aria-label="System map: places as regions, devices and services as boxes, connections as lines coloured by medium" viewBox="0 0 1600 860"></svg>
      </div>
      <figcaption class="legend" id="legend"></figcaption>
    </figure>
  </section>
  <section id="tab-list" role="tabpanel" aria-labelledby="t-list" class="doc" hidden></section>
  <section id="tab-api" role="tabpanel" aria-labelledby="t-api" class="doc" hidden></section>
  <section id="tab-secrets" role="tabpanel" aria-labelledby="t-secrets" class="doc" hidden></section>
  <section id="tab-questions" role="tabpanel" aria-labelledby="t-questions" class="doc" hidden></section>
  <section id="tab-agents" role="tabpanel" aria-labelledby="t-agents" class="doc" hidden></section>
</main>

<aside class="panel" id="panel" role="dialog" aria-modal="false" aria-labelledby="panel-title" hidden>
  <div class="panel-head">
    <div style="min-width:0">
      <div class="kicker" id="panel-kicker"></div>
      <h2 id="panel-title" tabindex="-1"></h2>
    </div>
    <div class="actions">
      <button type="button" class="icon-btn copy" id="panel-copy">Copy link</button>
      <button type="button" class="icon-btn" id="panel-close" aria-label="Close details">✕</button>
    </div>
  </div>
  <div class="panel-body" id="panel-body"></div>
</aside>

<footer id="footer">Source of truth: <a href="system.json">system.json</a>. Text version: <a href="system.html">system.md</a>. No passwords or token values appear anywhere on this page.</footer>

<script>
'use strict';
(function () {
  const SVGNS = 'http://www.w3.org/2000/svg';
  const $ = (id) => document.getElementById(id);
  const svg = $('map');
  const S = { doc: null, scenario: null, tab: 'map', sel: null, query: '', scale: null, hover: null };
  let byId = {}, people = {}, places = {}, questions = {}, sources = {};

  // ------------------------------------------------------------ helpers
  function el(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v);
    }
    for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
    return e;
  }
  function sv(tag, attrs, parent) {
    const e = document.createElementNS(SVGNS, tag);
    for (const [k, v] of Object.entries(attrs || {})) if (v !== null && v !== undefined) e.setAttribute(k, v);
    if (parent) parent.appendChild(e);
    return e;
  }
  const human = (k) => k.replace(/_/g, ' ').replace(/^\w/, (c) => c.toUpperCase());
  const defaultScenario = () => S.doc.scenarios[0].id;
  const scenarioOf = (id) => S.doc.scenarios.find((x) => x.id === id);
  const scenarioLabel = (s) => (s.name || s.id).split(':')[0].trim() || s.id;  // 'Now: Gray Area' -> 'Now'
  const oneScenario = () => S.doc.scenarios.length === 1;
  const short = (n) => n.short || n.name;
  const nodeVisible = (n, s = S.scenario) => n.place && n.place[s] != null;
  const linkVisible = (l, s = S.scenario) => l.scenarios.includes(s) && nodeVisible(byId[l.from], s) && nodeVisible(byId[l.to], s);
  const statusColor = (s) => `var(--s-${s || 'unknown'})`;
  const mediumColor = (m) => `var(--m-${m})`;
  function personName(id) { return people[id] ? people[id].name : (id === 'team' ? 'The team' : id); }
  function stripCidr(ip) { return String(ip).split('/')[0]; }
  function subline(n) {
    const ifs = (n.interfaces || []).filter((i) => i.ip && (!i.scenario || i.scenario === S.scenario));
    const tsOnly = ifs.filter((i) => i.name !== 'Tailscale');
    if (tsOnly.length) return stripCidr(tsOnly[0].ip);
    if (ifs.length) return stripCidr(ifs[0].ip);
    if (n.kind === 'endpoint') return 'to-be-a-river--river';
    if (n.hostnames && n.hostnames.length) return n.hostnames[0];
    if (n.specs && n.specs.model) return String(n.specs.model).slice(0, 24);
    return n.kind;
  }
  function copyText(text, btn) {
    const done = () => { const t = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = t; }, 1400); };
