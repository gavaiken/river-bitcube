<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e141a" media="(prefers-color-scheme: dark)">
  <title>Studio chat · Mission control</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/v2.css">
  <link rel="stylesheet" href="/chat.css">
  <script>try { const t = localStorage.getItem('mc-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
<main class="chat">
  <div class="share" role="note"><span class="share-ic" aria-hidden="true">💬</span><div><b>Everyone shares this conversation;</b> say who you are. The agent can look at the installation and change it, and what it does shows on Status.</div></div>
  <section id="thread" class="thread" aria-live="polite" aria-label="Requests and replies">
    <p class="muted thread-note" id="thread-note">Loading the conversation…</p>
  </section>
</main>
<div class="composer" id="composer">
  <div class="composer-in">
    <div class="pinned" id="pinned">
      <span class="mk lv-unknown" id="pin-mark" aria-hidden="true">?</span>
      <span class="pin-text" id="pin-text">Connecting…</span>
      <div class="stop-host" id="stop-host"><button class="btn danger" id="stop" type="button" disabled>Stop</button></div>
    </div>
    <div class="ctl-status" id="stop-status" aria-live="polite"></div>
    <div class="compose">
      <textarea id="text" rows="1" placeholder="Ask the agent to look, or to change something…" aria-label="Your request"></textarea>
      <button class="btn primary" id="send" type="button">Send</button>
    </div>
    <div class="ctl-status" id="send-status" aria-live="polite"></div>
  </div>
</div>
<script type="module" src="/chat.js"></script>
</body>
</html>
