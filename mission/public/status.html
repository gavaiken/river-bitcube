<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e141a" media="(prefers-color-scheme: dark)">
<title>Status · Mission control</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/v2.css">
<link rel="stylesheet" href="/status.css">
<script>try { const t = localStorage.getItem('mc-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
<main>
  <div class="col-a">
    <div id="banner" hidden></div>
    <section id="band" class="band lv-unknown" aria-label="The verdict"></section>
    <div id="band-live" class="sr-only" aria-live="polite"></div>
    <div id="ctl-live" class="sr-only" aria-live="polite"></div>
    <section class="card showing" id="showing" aria-label="What's showing" hidden></section>
    <section class="card now" aria-label="What the piece is doing">
      <div id="now-head"></div>
      <div id="now-steer"></div>
    </section>
  </div>
  <div class="col-b">
    <div id="problems"></div>
    <div id="fine"></div>
    <div id="installer"></div>
    <footer class="foot">
      <a href="/map">System map (for engineers)</a> ·
      <a href="/remembered">Remembered river (debug view)</a> ·
      <a href="https://gavaiken.github.io/river-bitcube/show-files" target="_blank" rel="noopener">Show files</a> ·
      <a href="https://gavaiken.github.io/river-bitcube/install" target="_blank" rel="noopener">Install guide</a> ·
      <a href="https://gavaiken.github.io/river-bitcube/execution-plan" target="_blank" rel="noopener">The plan</a>
      <div class="fine-print">A River Becoming at Gray Area, San Francisco, until 27 Oct · mission control</div>
    </footer>
  </div>
</main>
<script type="module" src="/status.js"></script>
</body>
</html>
