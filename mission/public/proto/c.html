<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2eee5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1218" media="(prefers-color-scheme: dark)">
<title>Mission control · A River Becoming</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f5f9f'/%3E%3Cpath d='M8 24c10-8 18 8 28 0s14-6 20 0M8 40c10-8 18 8 28 0s14-6 20 0' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/proto/c.css">
</head>
<body>
<div class="art" aria-hidden="true">
  <div class="wash"></div>
  <svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
    <path d="M-50 120 C 150 60, 300 200, 500 140 S 850 40, 1050 150 S 1250 220, 1300 160"/>
    <path d="M-50 230 C 200 170, 350 330, 600 250 S 900 140, 1250 270"/>
    <path d="M-50 360 C 120 300, 280 440, 480 380 S 780 290, 980 400 S 1200 470, 1300 380"/>
    <path d="M-50 470 C 220 420, 380 560, 620 480 S 940 400, 1250 520"/>
    <path d="M-50 600 C 160 540, 320 680, 540 610 S 860 520, 1060 640 S 1250 700, 1300 610"/>
    <path d="M-50 720 C 240 660, 400 790, 650 720 S 980 640, 1250 760"/>
    <path d="M-50 40 C 260 -10, 420 100, 700 50 S 1000 -20, 1250 60"/>
  </svg>
  <div class="ripple r1"></div><div class="ripple r2"></div><div class="ripple r3"></div>
</div>

<header class="top">
  <div class="in">
    <div class="brand"><span class="title">Mission control</span><span class="sub">A River Becoming</span></div>
    <nav class="wide" id="navWide" aria-label="Pages"></nav>
    <div class="fresh" id="fresh" aria-live="polite">Loading…</div>
    <button class="icon-btn" id="menuBtn" aria-label="Menu" title="Menu">&#8943;</button>
  </div>
</header>

<main>
  <section id="tab-status" class="tab on" aria-label="Status">
    <div id="staleBanner" hidden></div>
    <div class="cols">
      <div class="col-a">
        <section id="band" class="band unknown" aria-live="polite"></section>
        <section id="todo" class="panel todo"></section>
        <section id="now" class="panel now"></section>
        <section id="controls" class="panel controls" hidden></section>
      </div>
      <div class="col-b">
        <section id="feed" class="panel feed"></section>
      </div>
    </div>
  </section>

  <section id="tab-lights" class="tab" aria-label="Lights">
    <section class="panel"><h2>Lights</h2><div id="lights"></div></section>
  </section>

  <section id="tab-chat" class="tab" aria-label="Studio chat">
    <section class="panel">
      <h2>Studio chat</h2>
      <p class="chat-banner">Everyone on the team shares this one conversation with the agent; say who you are.</p>
      <div id="chatStatus" class="chat-status"><span class="pulse"></span><span class="txt">Ready</span></div>
      <ol id="chatLog" class="chat-log"></ol>
      <div class="composer">
        <textarea id="chatText" rows="2" placeholder="Ask the agent to look, or to change something…" aria-label="Message to the agent"></textarea>
        <button id="chatSend" class="btn primary">Send</button>
      </div>
      <div id="chatErr" class="err" aria-live="polite"></div>
    </section>
  </section>
</main>

<nav class="tabs" id="tabs" aria-label="Pages"></nav>
<div id="sheet"></div>

<script type="module" src="/proto/c.js"></script>
</body>
</html>
